{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4>Edit Book</h4>
            </div>
            <div class="card-body">
                <form id="editBookForm">
                    <input type="hidden" name="book_id" value="{{ book._id }}">
                    <div class="mb-3">
                        <label>Title *</label>
                        <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Author *</label>
                        <input type="text" name="author" class="form-control" value="{{ book.author }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Publisher</label>
                        <input type="text" name="publisher" class="form-control" value="{{ book.publisher }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label>Year</label>
                            <input type="number" name="year" class="form-control" value="{{ book.year }}">
                        </div>
                        <div class="col-md-6">
                            <label>Category</label>
                            <select name="category" class="form-control">
                                {% for category in categories %}
                                <option value="{{ category }}" {% if category == book.category %}selected{% endif %}>{{ category }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label>Total Copies</label>
                        <input type="number" name="total_copies" class="form-control" value="{{ book.total_copies }}" min="1">
                    </div>
                    <div class="mb-3">
                        <label>Location</label>
                        <input type="text" name="location" class="form-control" value="{{ book.location }}">
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ book.description }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Book</button>
                    <a href="{{ url_for('books.list_books') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
$('#editBookForm').on('submit', function(e) {
    e.preventDefault();
    $.ajax({
        url: '/books/edit/{{ book._id }}',
        method: 'POST',
        data: $(this).serialize(),
        success: function(response) {
            if (response.success) {
                alert('Book updated successfully!');
                window.location.href = '/books';
            } else {
                alert('Error: ' + response.message);
            }
        }
    });
});
</script>
{% endblock %}
