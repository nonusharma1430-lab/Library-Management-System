{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h4>Edit Member</h4>
            </div>
            <div class="card-body">
                <form id="editMemberForm">
                    <input type="hidden" name="member_id" value="{{ member._id }}">
                    <div class="mb-3">
                        <label>Full Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ member.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Phone *</label>
                        <input type="tel" name="phone" class="form-control" value="{{ member.phone }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ member.address }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <label>Member Type</label>
                            <select name="member_type" class="form-control">
                                <option value="Regular" {% if member.member_type == 'Regular' %}selected{% endif %}>Regular</option>
                                <option value="Premium" {% if member.member_type == 'Premium' %}selected{% endif %}>Premium</option>
                                <option value="Student" {% if member.member_type == 'Student' %}selected{% endif %}>Student</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>Max Books Allowed</label>
                            <input type="number" name="max_books" class="form-control" value="{{ member.max_books }}" min="1" max="20">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Membership Status</label>
                        <select name="membership_status" class="form-control">
                            <option value="Active" {% if member.membership_status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if member.membership_status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            <option value="Suspended" {% if member.membership_status == 'Suspended' %}selected{% endif %}>Suspended</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Member</button>
                    <a href="{{ url_for('members.list_members') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
$('#editMemberForm').on('submit', function(e) {
    e.preventDefault();
    $.ajax({
        url: '/members/edit/{{ member._id }}',
        method: 'POST',
        data: $(this).serialize(),
        success: function(response) {
            if (response.success) {
                alert('Member updated successfully!');
                window.location.href = '/members';
            } else {
                alert('Error: ' + response.message);
            }
        }
    });
});
</script>
{% endblock %}
